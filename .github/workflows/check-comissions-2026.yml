name: Diagnose comissions inscription
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-comissions-2026.yml']
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: GET public web app and POST synthetic submission if accessible
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error, sys
          cfg=json.load(open("inscripcions-config.json"))
          url=cfg.get("endpoint", "")
          print("CONFIG_ENABLED", cfg.get("enabled"))
          print("ENDPOINT_CORRECT_FORMAT", url.startswith("https://script.google.com/macros/s/") and url.endswith("/exec"))
          assert cfg.get("enabled"), "Config not enabled"
          headers={"User-Agent":"Mozilla/5.0 (compatible; CCOOEndpointCheck/1.0)"}
          def fetch(request):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status,response.read(350000).decode("utf-8","replace"),response.geturl()
              except urllib.error.HTTPError as e:
                  return e.code,e.read(350000).decode("utf-8","replace"),e.geturl()
          code,html,where=fetch(urllib.request.Request(url,headers=headers))
          print("GET_HTTP",code)
          print("GET_FINAL_HOST",urllib.parse.urlsplit(where).hostname)
          print("GET_HEADER_MATCH", "Enllaç de registre" in html)
          if code!=200 or "Enllaç de registre" not in html:
              print("GET_PAGE_EXCERPT",html[-1250:].replace('\n',' ')[:1250])
              sys.exit("APP_SCRIPT_GET_UNAVAILABLE: check version and Who has access -> Anyone")
          print("GET_READY")
          testname="PROVA TECNICA CCOO INSCRIPCIONS 20261017"
          data=urllib.parse.urlencode({"fullName":testname,"sessions":"2026-11-12-INF-HCAP","website":""}).encode("utf-8")
          code,html,where=fetch(urllib.request.Request(url,data=data,method="POST",
               headers={**headers,"Content-Type":"application/x-www-form-urlencoded"}))
          print("POST_HTTP",code)
          print("POST_FINAL_HOST",urllib.parse.urlsplit(where).hostname)
          print("POST_SUCCESS", "Inscripció registrada" in html)
          print("POST_RESPONSE_EXCERPT",html[-450:].replace('\n',' '))
          if code!=200 or "Inscripció registrada" not in html:
              sys.exit("APP_SCRIPT_POST_NOT_CONFIRMED")
          print("TEST_PERSON_NAME",testname)
          PY
