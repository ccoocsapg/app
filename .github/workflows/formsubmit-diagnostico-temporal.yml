name: Diagnostico temporal de FormSubmit CCOO
on:
  push:
    paths:
      - '.github/workflows/formsubmit-diagnostico-temporal.yml'
  workflow_dispatch:
jobs:
  test-formsubmit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verificar el servicio con datos sinteticos
        shell: bash
        run: |
          set -euo pipefail
          curl --location --show-error --silent --max-time 25 --request POST 'https://formsubmit.co/ajax/ccoohrsc@csapg.cat' \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --data '{"name":"CCOO CSAPG prueba tecnica","email":"formulario-prueba@example.com","message":"Prueba tecnica del circuito de activacion sin datos reales de trabajadores.","_subject":"CCOO CSAPG - Prueba tecnica de activacion","_url":"https://ccoocsapg.github.io/app/reclamacio-hores-it-naixement.html"}' \
            --write-out '\nHTTP_CODE=%{http_code}\n'
