name: CCOO IT - prova única del formulari
on:
  push:
    paths:
      - '.github/workflows/it-mail-endpoint-prova-unica.yml'
jobs:
  provar-formulari:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Provar GET i POST al servei de CCOO sense dades reals
        shell: bash
        env:
          ENDPOINT: https://script.google.com/macros/s/AKfycbzMYvYV5o9h7lkC1SkihosFnyqGpi2qIfHuhLpKHC2PVErP6f4E7bncTIa9tLFY4lA/exec
        run: |
          set -euo pipefail
          echo "GET: comprovant que el web app respon com el servei de CCOO..."
          get_status=$(curl -L -sS --max-time 35 --output /tmp/ccoo_get.html --write-out '%{http_code}' "$ENDPOINT")
          echo "GET HTTP $get_status"
          if grep -Fqi 'Aquest servei només accepta' /tmp/ccoo_get.html; then
            echo 'GET CCOO_CONFIRMED'
          else
            echo 'GET CCOO_NOT_CONFIRMED'
            head -c 450 /tmp/ccoo_get.html || true
            echo
            exit 1
          fi
          echo "POST: enviant una única prova fictícia (sense dades de cap treballador)..."
          post_status=$(curl -L -sS --max-time 45 --output /tmp/ccoo_post.html --write-out '%{http_code}' \
            --data-urlencode 'person=PROVA TECNICA FORMULARI CCOO' \
            --data-urlencode 'email=prova-tecnica@example.com' \
            --data-urlencode 'leave=it' \
            --data-urlencode 'year=2026' \
            --data-urlencode 'issue=unsure' \
            --data-urlencode 'centre=PROVA SENSE DADES REALS' \
            --data-urlencode 'more=Prova de recepció del formulari web 2026-11-02, dades totalment fictícies.' \
            --data-urlencode 'accepted=yes' \
            --data-urlencode 'website=' \
            "$ENDPOINT")
          echo "POST HTTP $post_status"
          if grep -Fqi 'La teva comunicació s’ha enviat correctament' /tmp/ccoo_post.html; then
            echo 'POST CCOO_FORM_ACCEPTED'
          elif grep -Fqi 'Comunicació enviada' /tmp/ccoo_post.html; then
            echo 'POST CCOO_FORM_ACCEPTED_TITLE'
          else
            echo 'POST CCOO_FORM_NOT_ACCEPTED'
            head -c 450 /tmp/ccoo_post.html || true
            echo
            exit 1
          fi
