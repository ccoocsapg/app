name: Temporary check inscriptions v2
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-inscriptions-v2.yml"
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: GET v2 and submit single test only when doGet is available
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, urllib.error, re
          url="https://script.google.com/macros/s/AKfycbzwXcLSrufEC-7-T6qD2Fn04-DkI0ZfcUUUiOxFgmYN1Lu1jKLLj3pTc-d_56mihhI/exec"
          headers={"User-Agent":"Mozilla/5.0 (Macintosh; CCOO CSAPG acceptance test)"}
          def run(request,label):
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      body=response.read(300000).decode("utf-8","replace")
                      code=response.status
                      destination=response.geturl()
              except urllib.error.HTTPError as e:
                  code=e.code;body=e.read(300000).decode("utf-8","replace");destination=e.geturl()
              print(label+"_HTTP",code)
              print(label+"_URL_HOST",urllib.parse.urlparse(destination).netloc)
              print(label+"_DOGET_PRESENT", "Enllaç de registre" in body)
              print(label+"_POST_SUCCESS", "Inscripció registrada" in body)
              print(label+"_HAS_ERROR", "Script function not found" in body or "No s’ha pogut registrar" in body)
              print(label+"_MESSAGE", " ".join(re.findall(r"<(?:h1|p)[^>]*>(.*?)</(?:h1|p)>",body,flags=re.S))[:300])
              return code,body
          code,body=run(urllib.request.Request(url,headers=headers),"GET")
          if code!=200 or "Enllaç de registre" not in body or "Script function not found" in body:
              raise SystemExit("GET_ENDPOINT_NOT_READY")
          test_name="PROVA TECNICA CCOO INSCRIPCIONS 17 OCT 2026 V2"
          print("TEST_NAME",test_name)
          data=urllib.parse.urlencode({"fullName":test_name,"sessions":"2026-11-12-INF-HCAP","website":""}).encode()
          code,body=run(urllib.request.Request(url,data=data,method="POST",headers={**headers,"Content-Type":"application/x-www-form-urlencoded"}),"POST")
          if code!=200 or "Inscripció registrada" not in body or "No s’ha pogut registrar" in body:
              raise SystemExit("POST_NOT_SAVED_OR_NOT_CONFIRMED")
          print("TEST_SUBMISSION_SUCCESSFUL")
          PY
